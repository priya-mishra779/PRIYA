<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #071a2f 0%, #0d2340 45%, #123d75 100%);
            color: #eaf4ff;
        }

        .signup-box {
            width: 100%;
            max-width: 430px;
            background: rgba(255, 255, 255, 0.95);
            padding: 32px 28px;
            border-radius: 18px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.22);
        }

        .brand {
            text-align: center;
            margin-bottom: 18px;
        }

        .brand-badge {
            width: 64px;
            height: 64px;
            margin: 0 auto 12px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1e90ff, #123d75);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            font-weight: 700;
        }

        h2 {
            margin: 0;
            font-size: 30px;
            text-align: center;
            color: #111827;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin: 10px 0 24px;
            font-size: 14px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12);
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #4b5563;
        }

        .checkbox-row input {
            width: 16px;
            height: 16px;
            margin: 0;
        }

        .signup-btn {
            padding: 14px 16px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #1e90ff, #123d75);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .signup-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 20px rgba(18, 61, 117, 0.3);
        }

        .login-text {
            text-align: center;
            font-size: 14px;
            color: #4b5563;
            margin-top: 18px;
        }

        .login-text a {
            color: #123d75;
            text-decoration: none;
            font-weight: 600;
        }

        .status {
            min-height: 20px;
            margin: 14px 0 0;
            text-align: center;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="signup-box">
        <div class="brand">
            <div class="brand-badge">S</div>
            <h2>Create account</h2>
        </div>

        <p class="subtitle">Join us and get started today</p>

        <form id="register-form" action="#" method="post">
            <div>
                <label for="fullname">Full name</label>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required />
            </div>

            <div>
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required />
            </div>

            <div>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password" required />
            </div>

            <div>
                <label for="confirm-password">Confirm password</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter your password" required />
            </div>

            <label class="checkbox-row">
                <input type="checkbox" name="agree" required />
                I agree to the terms and privacy policy
            </label>

            <button type="submit" class="signup-btn">Sign Up</button>
        </form>

        <p class="status" id="status" role="status" aria-live="polite"></p>
        <p class="login-text">Already have an account? <a href="login.html">Login</a></p>
    </div>
    <script>
        const form = document.getElementById("register-form");
        const status = document.getElementById("status");
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirm-password");
        const backendUrl = "http://127.0.0.1:5000";
        const apiUrl = window.location.port === "5000"
            ? "/api"
            : `${backendUrl}/api`;
        const loginUrl = window.location.port === "5000"
            ? "/login.html"
            : `${backendUrl}/login.html`;

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            if (password.value.length < 8) {
                status.style.color = "#b42318";
                status.textContent = "Password must contain at least 8 characters.";
                return;
            }

            if (password.value !== confirmPassword.value) {
                status.style.color = "#b42318";
                status.textContent = "Passwords do not match.";
                return;
            }

            const submitButton = form.querySelector("button[type='submit']");
            submitButton.disabled = true;
            status.style.color = "#64748b";
            status.textContent = "Creating your account...";

            try {
                const response = await fetch(`${apiUrl}/register`, {
                    method: "POST",
                    credentials: "include",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        full_name: document.getElementById("fullname").value.trim(),
                        email: document.getElementById("email").value.trim(),
                        password: password.value
                    })
                });
                const result = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(result.error || "Unable to create account.");
                }

                status.style.color = "#067647";
                status.textContent = "Account created. Redirecting to login...";
                form.reset();
                setTimeout(() => {
                    window.location.href = loginUrl;
                }, 700);
            } catch (error) {
                status.style.color = "#b42318";
                status.textContent = error.message || "Unable to connect to the backend.";
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
