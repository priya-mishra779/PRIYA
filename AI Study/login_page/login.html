<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in to your AI Study account." />
    <title>Login | AI Study</title>
    <style>
        :root {
            color-scheme: light;
            --navy: #102a56;
            --blue: #2563eb;
            --blue-light: #eff6ff;
            --text: #172033;
            --muted: #64748b;
            --border: #dbe3ef;
            --surface: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 15% 15%, rgba(37, 99, 235, 0.3), transparent 32%),
                linear-gradient(135deg, #071a2f 0%, #0d2340 52%, #123d75 100%);
        }

        .login-card {
            display: grid;
            grid-template-columns: minmax(260px, 0.9fr) minmax(320px, 1.1fr);
            width: min(920px, 100%);
            min-height: 560px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            background: var(--surface);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
        }

        .welcome-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 48px;
            color: white;
            background: linear-gradient(155deg, #123d75, #102a56 72%);
        }

        .logo {
            display: inline-grid;
            width: 52px;
            height: 52px;
            place-items: center;
            border-radius: 16px;
            background: #ffffff;
            color: var(--blue);
            font-size: 24px;
            font-weight: 800;
        }

        .welcome-panel h1 {
            max-width: 290px;
            margin: 40px 0 16px;
            font-size: clamp(30px, 4vw, 44px);
            line-height: 1.08;
        }

        .welcome-panel p {
            max-width: 310px;
            margin: 0;
            color: #c9d8ef;
            line-height: 1.7;
        }

        .quote {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 13px;
            color: #c9d8ef;
        }

        .form-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 48px clamp(28px, 6vw, 72px);
        }

        .form-panel h2 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        .subtitle {
            margin: 0 0 30px;
            color: var(--muted);
        }

        form {
            display: grid;
            gap: 18px;
        }

        .field {
            display: grid;
            gap: 8px;
        }

        label {
            font-size: 14px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            color: var(--text);
            font: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap input {
            padding-right: 72px;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 10px;
            padding: 6px;
            border: 0;
            transform: translateY(-50%);
            background: transparent;
            color: var(--blue);
            font-weight: 700;
            cursor: pointer;
        }

        .options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 13px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-weight: 500;
        }

        .remember input {
            width: 16px;
            height: 16px;
            accent-color: var(--blue);
        }

        a {
            color: var(--blue);
            font-weight: 700;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .login-button {
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: linear-gradient(135deg, #2563eb, #123d75);
            color: white;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .login-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 22px rgba(18, 61, 117, 0.28);
        }

        .login-button:focus-visible,
        .toggle-password:focus-visible,
        a:focus-visible {
            outline: 3px solid rgba(37, 99, 235, 0.3);
            outline-offset: 3px;
        }

        .status {
            min-height: 20px;
            margin: 0;
            color: #b42318;
            font-size: 13px;
        }

        .signup {
            margin: 24px 0 0;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
        }

        @media (max-width: 700px) {
            body {
                padding: 12px;
            }

            .login-card {
                display: block;
                min-height: auto;
            }

            .welcome-panel {
                min-height: 250px;
                padding: 30px;
            }

            .welcome-panel h1 {
                margin: 25px 0 10px;
                font-size: 32px;
            }

            .quote {
                display: none;
            }

            .form-panel {
                padding: 34px 26px 38px;
            }
        }
    </style>
</head>
<body>
    <main class="login-card">
        <section class="welcome-panel" aria-label="AI Study introduction">
            <div>
                <div class="logo" aria-hidden="true">AI</div>
                <h1>Learn smarter, every day.</h1>
                <p>Access your personalised AI Study workspace and continue where you left off.</p>
            </div>
            <p class="quote">“Small progress every day adds up to big results.”</p>
        </section>

        <section class="form-panel">
            <h2>Welcome back</h2>
            <p class="subtitle">Sign in to continue to AI Study.</p>

            <form id="login-form" action="#" method="post">
                <div class="field">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" autocomplete="email"
                           placeholder="you@example.com" required />
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <div class="password-wrap">
                        <input type="password" id="password" name="password"
                               autocomplete="current-password" placeholder="Enter your password" required />
                        <button class="toggle-password" type="button" aria-controls="password"
                                aria-label="Show password">Show</button>
                    </div>
                </div>

                <div class="options">
                    <label class="remember">
                        <input type="checkbox" name="remember" />
                        Remember me
                    </label>
                    <a href="#" id="forgot-password">Forgot password?</a>
                </div>

                <p class="status" id="status" role="status" aria-live="polite"></p>
                <button class="login-button" type="submit">Log in</button>
            </form>

            <p class="signup">Don’t have an account? <a href="register.html">Create one</a></p>
        </section>
    </main>

    <script>
        const form = document.getElementById("login-form");
        const password = document.getElementById("password");
        const togglePassword = document.querySelector(".toggle-password");
        const status = document.getElementById("status");
        const forgotPassword = document.getElementById("forgot-password");
        togglePassword.addEventListener("click", () => {
            const isPassword = password.type === "password";
            password.type = isPassword ? "text" : "password";
            togglePassword.textContent = isPassword ? "Hide" : "Show";
            togglePassword.setAttribute("aria-label", `${isPassword ? "Hide" : "Show"} password`);
        });

        const backendUrl = "http://127.0.0.1:5000";
        const apiUrl = window.location.port === "5000"
            ? "/api"
            : `${backendUrl}/api`;
        const dashboardUrl = window.location.port === "5000"
            ? "/dashboard"
            : `${backendUrl}/dashboard`;

        form.addEventListener("submit", async (event) => {
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            event.preventDefault();
            const submitButton = form.querySelector("button[type='submit']");
            submitButton.disabled = true;
            status.style.color = "#64748b";
            status.textContent = "Signing in...";

            try {
                const response = await fetch(`${apiUrl}/login`, {
                    method: "POST",
                    credentials: "include",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        email: document.getElementById("email").value.trim(),
                        password: password.value
                    })
                });
                const result = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(result.error || "Unable to sign in.");
                }

                status.style.color = "#067647";
                status.textContent = `Welcome back, ${result.user.full_name || "student"}.`;
                setTimeout(() => {
                    window.location.href = dashboardUrl;
                }, 500);
            } catch (error) {
                status.style.color = "#b42318";
                status.textContent = error.message || "Unable to connect to the backend.";
                submitButton.disabled = false;
            }
        });

        forgotPassword.addEventListener("click", (event) => {
            event.preventDefault();
            status.textContent = "Password recovery will be available soon.";
        });
    </script>
</body>
</html>
